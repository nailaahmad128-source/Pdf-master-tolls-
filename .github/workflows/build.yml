name: Build Android

# Builds run entirely on GitHub's servers — nothing needs to be built
# locally, which matters since this project is developed from a
# Termux/mobile environment with no local Flutter or Android SDK.
#
# Triggers:
#   - Every push to main: runs analyze + a debug APK build as a fast
#     correctness check.
#   - Manual dispatch: lets you choose to also produce a signed release
#     APK and/or AAB (App Bundle) for Google Play, using secrets you
#     configure in this repo's Settings -> Secrets and variables -> Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK + AAB"
        type: boolean
        default: true

env:
  FLUTTER_CHANNEL: "stable"

jobs:
  build:
    name: Analyze & Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Ensure Gradle wrapper jar is present
        # gradle-wrapper.jar is a binary file; rather than commit it, it's
        # fetched here from Gradle's own official GitHub releases so the
        # wrapper scripts (gradlew/gradlew.bat) work on the runner.
        run: |
          cd android
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching gradle-wrapper.jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Debug APK build (fast correctness check)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_release != 'true'
        run: flutter build apk --debug

      # ---------------------------------------------------------------
      # Everything below only runs for a manual "Run workflow" dispatch
      # with build_release checked, since it needs your signing secrets.
      # ---------------------------------------------------------------

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
            echo "Release signing configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — release build will be signed with the debug key instead. Add the secret before publishing to Google Play."
          fi

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
        run: |
          flutter build apk --release \
            --dart-define=ADMOB_BANNER_UNIT_ID="${{ secrets.ADMOB_BANNER_UNIT_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT_ID="${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}" \
            --dart-define=PRIVACY_POLICY_URL="${{ secrets.PRIVACY_POLICY_URL }}" \
            --dart-define=SYNCFUSION_LICENSE_KEY="${{ secrets.SYNCFUSION_LICENSE_KEY }}"

      - name: Build release AAB (App Bundle, for Google Play)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
        run: |
          flutter build appbundle --release \
            --dart-define=ADMOB_BANNER_UNIT_ID="${{ secrets.ADMOB_BANNER_UNIT_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_UNIT_ID="${{ secrets.ADMOB_INTERSTITIAL_UNIT_ID }}" \
            --dart-define=PRIVACY_POLICY_URL="${{ secrets.PRIVACY_POLICY_URL }}" \
            --dart-define=SYNCFUSION_LICENSE_KEY="${{ secrets.SYNCFUSION_LICENSE_KEY }}"

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-master-tools-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-master-tools-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-master-tools-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
