name: pdf_master_tools
description: "PDF Master Tools - Professional PDF toolkit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage (metadata: library entries, tool history, trash records)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # PDF engine: merge / split / reorder / rotate / security / fill forms
  syncfusion_flutter_pdf: ^27.1.58
  # PDF viewer for the reader screen
  syncfusion_flutter_pdfviewer: ^27.1.58
  # Explicit dependency (not just transitive) since main.dart calls
  # SyncfusionLicense.registerLicense() directly — see AppConfig.
  syncfusion_flutter_core: ^27.1.58
  # Rasterizing PDF pages <-> images (PDF to Image, thumbnails, compression re-encode)
  printing: ^5.13.1
  pdf: ^3.11.1

  # Image handling
  image: ^4.2.0
  image_picker: ^1.1.2

  # File selection / IO
  file_picker: 10.3.10
  share_plus: ^10.1.2
  open_filex: ^4.5.0

  # Signature capture for Fill & Sign
  signature: ^5.5.0

  # QR
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Swipe-to-share/favorite/delete actions on Library document tiles
  flutter_slidable: ^3.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Links
  url_launcher: ^6.3.1

  # Utility collection helpers (firstOrNull, etc.)
  collection: ^1.19.0

  # App version info for Settings
  package_info_plus: ^8.1.2

  # Ads
  google_mobile_ads: ^9.0.0

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
